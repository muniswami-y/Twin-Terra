name: Twin-Terra Dataset & Schema CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Schema, Parity & Scientific Integrity Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Schema Contract & Spatial Separation Gate
        run: |
          python scripts/validate_schema.py --data data/candidates.csv --dict data/feature_dictionary.csv --prov data/provenance

      - name: Run Quality Assurance & Graded Scoring Rubric
        run: |
          python scripts/qa_report.py --data data/candidates.csv --dict data/feature_dictionary.csv --prov data/provenance --outdir data/interim

      - name: Run Pytest Validation Suite
        run: |
          pytest tests/test_schema.py -v
